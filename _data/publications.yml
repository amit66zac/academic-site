- id: digital-markets-noncompliance-2025
  title: "Digital Markets and Hidden Noncompliance"
  authors: "Amit Zac, Stefan Bechtold, Pablo Wey, David Rodriguez, Jose M. Del Alamo"
  venue: "Journal of Legal Studies"
  year: 2025
  type: journal
  status: forthcoming
  pdf: "Digital Markets and Hidden Noncompliance.pdf"
  figure: "digital-markets-noncompliance.png"
  abstract: "Regulatory oversight in digital markets poses a significant challenge. Using European privacy law as a case study—and focusing on the fallout from the European Court of Justice's 2020 invalidation of the EU-US Privacy Shield—we examine how over 2,500 apps from the Spanish Google Play Store responded to this legal shift. We find a striking divergence between firms' stated privacy policies and their actual cross-border data transfer behaviors. Drawing on tools from IT security research to observe data flows typically inaccessible to legal scholars, we show that traditional policy-based methods may miss a substantial share of violations."

- id: dark-patterns-2025
  title: "Dark Patterns and Online Consumer Vulnerability"
  authors: "Amit Zac, Yu-Chun Huang, Amédée von Moltke, Christopher Decker, Ariel Ezrachi"
  venue: "Behavioural Public Policy"
  year: 2025
  type: journal
  status: forthcoming
  pdf: "Dark patterns and consumer vulnerability.pdf"
  doi: "10.1017/bpp.2024.49"
  link: "https://doi.org/10.1017/bpp.2024.49"
  figure: "dark-patterns.png"
  abstract: "Dark patterns that manipulate consumer behaviour are now a pervasive feature of digital markets. Using a novel empirical design, we find strong evidence that individuals across all groups are susceptible to dark patterns, and only weak evidence that user susceptibility is materially affected by commonly used general proxies for consumer vulnerability (such as income, educational attainment or age). Our study also finds that added friction, in the form of required payment action following successful deployment of dark patterns, reduces their effectiveness."

- id: cookie-compliance-2024
  title: "Automated Large-Scale Analysis of Cookie Notice Compliance"
  authors: "Ahmed Bouhoula, Karel Kubicek, Amit Zac, Carlos Cotrini, David Basin"
  venue: "Proceedings of the 33rd USENIX Security Symposium"
  year: 2024
  type: conference
  pdf: "Automated Large Scale Analysis of Cookie Notice Compliance.pdf"
  link: "https://www.usenix.org/conference/usenixsecurity24"
  figure: "cookie-compliance.png"
  abstract: "We present the first general, automated, large-scale analysis of cookie notice compliance. Our method interacts with cookie notices, observes declared processing purposes and available consent options using Natural Language Processing, and compares them to the actual use of cookies. We provide a general view of the overall compliance picture using a set of 97k websites popular in the EU. We report that 65.4% of websites offering a cookie rejection option likely collect user data despite explicit negative consent."

- id: generative-ai-consumer-2024
  title: "Is Generative AI the Algorithmic Consumer We Are Waiting For?"
  authors: "Michal Gal, Amit Zac"
  venue: "Network Law Review"
  year: 2024
  type: journal
  pdf: "Is Generative AI the Algorithmic Consumer We Are Waiting for.pdf"
  abstract: "Most studies on the competitive effects of Generative AI focus on the supply side. In this article, we focus on the potential effects of Generative AI on competition that arise from an active use on the demand side, by consumers seeking goods and services. We explore the possibility that LLMs can act as truncated algorithmic consumers, assisting consumers in deciding which products and services to purchase, thereby potentially reducing consumers' information costs and increasing competition. We then analyze limitations and competition concerns, showing how LLMs' modus operandi leads to outcome homogenization and increases entry barriers for new competitors."

- id: predistribution-redistribution-2024
  title: "Predistribution versus Redistribution: The Role of Competition Law"
  authors: "Amit Zac"
  venue: "Research Handbook on Sustainability and Competition Law"
  year: 2024
  type: chapter
  publisher: "Edward Elgar"
  pdf: "Predistribution versus redistribution why competition law is much more than a tool to alleviate poverty.pdf"
  figure: "predistribution-redistribution.png"
  abstract: "After decades of post-WWII prosperity, economic inequality levels have been increasing in many parts of the world. This chapter examines the complex interlinks between effective competition law, intense competition, and economic inequality, arguing that competition law operates as a pre-distributive tool—shaping market outcomes before redistribution—rather than merely alleviating poverty after the fact."

- id: inequality-effects-2023
  title: "The Effects of Competition Law on Inequality — An Incidental By-Product or a Path for Societal Change?"
  authors: "Ariel Ezrachi, Amit Zac, Christopher Decker"
  venue: "Journal of Antitrust Enforcement"
  year: 2023
  type: journal
  volume: "11(1)"
  pages: "51-73"
  pdf: "The effects of competition law on inequality—an incidental by-product or a path for societal change?.pdf"
  doi: "10.1093/jaenfo/jnac011"
  link: "https://doi.org/10.1093/jaenfo/jnac011"
  figure: "inequality-effects.png"
  abstract: "Rising economic inequality presents society with unprecedented challenges. In this article we explore whether competition law can play a role in reducing the widening inequality gap. We outline the possible relationship between competition law enforcement, market power, and economic inequality, supplement the theoretical discussion with empirical analysis, and emphasize the role of labour compensation as a key mechanism linking competition law enforcement, competition dynamics, and economic inequality."

- id: sustainablesignals-2023
  title: "SUSTAINABLESIGNALS: An AI Approach for Inferring Consumer Product Sustainability"
  authors: "Tong Lin, Tianliang Xu, Amit Zac, Sabina Tomkins"
  venue: "Proceedings of the Thirty-Second International Joint Conference on Artificial Intelligence (IJCAI 2023)"
  year: 2023
  type: conference
  pdf: "SUSTAINABLESIGNALS An AI Approach for Inferring Consumer Product Sustainability.pdf"
  doi: "10.24963/ijcai.2023/673"
  link: "https://doi.org/10.24963/ijcai.2023/673"
  figure: "sustainablesignals.png"
  abstract: "Everyday consumption of household goods is a significant source of environmental pollution. We contribute an analysis of the online environment, exploring how the dynamic between sellers and consumers surfaces claims and concerns regarding sustainable consumption. We propose a machine learning method that can discover signals of sustainability from these interactions. Our method, SUSTAINABLESIGNALS, is a first step in scaling up the provision of sustainability cues to online consumers."

- id: labour-share-2023
  title: "Competition Policy and the Labour Share"
  authors: "Amit Zac, Carola Casti, Christopher Decker, Ariel Ezrachi"
  venue: "Journal of Law, Economics, and Organization"
  year: 2023
  type: journal
  pdf: "Competition policy and the labor share.pdf"
  doi: "10.1093/jleo/ewad008"
  link: "https://doi.org/10.1093/jleo/ewad008"
  abstract: "Recent years have seen intense debate about the causes of the observed decline in the labor share. We extend this inquiry by investigating whether the design and enforcement of competition law and policy are associated with changes in the labor share. Using a panel of 22 industries in 12 OECD economies, we find a positive statistical association between the effectiveness of competition policy and changes in the labor share over the period 1995–2005."

- id: household-inequality-uk-2022
  title: "Competition Law Enforcement and Household Inequality in the United Kingdom"
  authors: "Christopher Decker, Amit Zac, Carola Casti, Amédée von Moltke, Ariel Ezrachi"
  venue: "Journal of Competition Law and Economics"
  year: 2022
  type: journal
  volume: "18(4)"
  pages: "905-935"
  pdf: "COMPETITION LAW ENFORCEMENT AND HOUSEHOLD INEQUALITY IN THE UNITED KINGDOM.pdf"
  doi: "10.1093/joclec/nhac006"
  link: "https://doi.org/10.1093/joclec/nhac006"
  figure: "household-inequality-uk.png"
  abstract: "Using a comprehensive database of all the decisions made under European and U.K. competition laws over the 15-year period to 2020, alongside households' consumption and market data, we estimate the level and distribution of the savings from enforcement across the United Kingdom. We find that competition law enforcement generated greater proportional savings for lower- and average-income households relative to the wealthiest households."

- id: us-model-inequality-2022
  title: "Competition Law and Economic Inequality: A Comparative Analysis of the US Model of Law"
  authors: "Amit Zac"
  venue: "Journal of International Economic Law"
  year: 2022
  type: journal
  volume: "25(3)"
  pages: "484-500"
  pdf: "Competition Law and Economic Inequality A Comparative Analysis of the US Model of Law.pdf"
  doi: "10.1093/jiel/jgac028"
  link: "https://doi.org/10.1093/jiel/jgac028"
  figure: "us-model-inequality.png"
  abstract: "To what extent does the choice of competition law model correlate with economic inequality? This article utilizes a comparative legal approach and a unique estimation framework based on textual similarity to estimate the differences between the US and EU models and provides evidence that countries that adopt a US-style antitrust model are more likely to exhibit higher income inequality levels over time."

