---
layout: default
---

<article class="page">
  <header class="page-header">
    {% if page.eyebrow %}<p class="section-kicker">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
