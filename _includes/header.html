<header class="site-header" role="banner">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-name">{{ site.title }}</a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
      <span class="hamburger"></span>
    </button>
    <nav class="nav" aria-label="Main">
      <ul class="nav-list">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications/' %} aria-current="page"{% endif %}>Publications</a></li>
        <li><a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a></li>
        <li><a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a></li>
        <li><a href="{{ '/lab/' | relative_url }}"{% if page.url == '/lab/' %} aria-current="page"{% endif %}>Lab</a></li>
        <li><a href="{{ '/teaching/' | relative_url }}"{% if page.url == '/teaching/' %} aria-current="page"{% endif %}>Teaching</a></li>
        <li><a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>
    <button type="button" class="theme-toggle" aria-label="Toggle dark mode" data-theme-toggle title="Toggle dark mode"></button>
  </div>
</header>
